name: Deploy (Vercel · production)

# Production deploy fires on every successful push to main. PRs use
# Vercel's preview-deploy mechanism (configured via the GitHub→Vercel
# integration), so this workflow doesn't run on PRs.
on:
  push:
    branches: [main]

# A second push to main while one is deploying should cancel the older
# run and ship the newer commit. Production never wants to walk back.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: vercel · production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required secrets (configure in repo settings → Secrets and variables → Actions):
    #   VERCEL_TOKEN       — personal/team deployment token (https://vercel.com/account/tokens)
    #   VERCEL_ORG_ID      — from `.vercel/project.json` after `vercel link`
    #   VERCEL_PROJECT_ID  — same source
    # If these aren't set yet, the job will fail loudly at the deploy step
    # rather than silently no-op.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the same gate CI runs so a broken main never reaches Vercel.
      # If CI on the merge commit already passed, this is fast (cached)
      # and gives us belt-and-braces.
      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
